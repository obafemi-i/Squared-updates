<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Squared</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>">
<style>
:root{--fg:#12372a;--mut:#3f6b5a;--dot:#12372a;--edge:rgba(18,55,42,.2);--hover:rgba(18,55,42,.5);--card:rgba(255,255,255,.55);--card-b:rgba(255,255,255,.7);
--p1:#0b7a75;--p2:#ee6c4d;--on:#fff;--btn:#0b7a75;--btn-fg:#fff;--field:rgba(255,255,255,.75);
--g1:#d8f3dc;--g2:#b7e4c7;--g3:#95d5b2;--g4:#a8e6e0;--g5:#c9f0d9}
@media (prefers-color-scheme:dark){:root{--fg:#e6fff5;--mut:#9fd8c3;--dot:#e6fff5;--edge:rgba(230,255,245,.2);--hover:rgba(230,255,245,.55);--card:rgba(0,0,0,.25);--card-b:rgba(255,255,255,.12);
--p1:#3ddbc8;--p2:#ff8a6b;--on:#062a22;--btn:#3ddbc8;--btn-fg:#062a22;--field:rgba(0,0,0,.3);
--g1:#062a22;--g2:#0b3d3a;--g3:#114b3f;--g4:#0a3a4a;--g5:#0d4a38}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;
background:linear-gradient(125deg,var(--g1),var(--g2),var(--g3),var(--g4),var(--g5),var(--g1));background-size:400% 400%;animation:flow 22s ease infinite;
display:flex;flex-direction:column;align-items:center;padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(16px,env(safe-area-inset-bottom))}
@keyframes flow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@media (prefers-reduced-motion:reduce){body{animation:none}.sweep,.pop{animation:none}}
h1{font-size:1.7rem;margin:8px 0 4px;letter-spacing:.02em}
.sub{color:var(--mut);margin:0 0 8px;font-size:.95rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;margin:8px 0}
.card{background:var(--card);border:1px solid var(--card-b);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:20px;padding:14px;box-shadow:0 8px 30px rgba(0,40,30,.12)}
#lobby{display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px 22px}
.pill{padding:6px 14px;border-radius:999px;border:3px solid transparent;font-weight:700;background:var(--card);backdrop-filter:blur(6px);transition:border-color .25s,transform .35s cubic-bezier(.3,1.6,.5,1)}
.pill.on{transform:scale(1.07);border-color:currentColor}
#s1{color:var(--p1)}#s2{color:var(--p2)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--edge);margin-right:6px}
.dot.on{background:#2ecc71}
button,input,select{font:inherit;padding:9px 16px;border-radius:12px;border:1px solid var(--edge);background:var(--field);color:var(--fg)}
button{cursor:pointer;background:var(--btn);color:var(--btn-fg);border-color:transparent;font-weight:600;transition:transform .1s}
button:hover:not(:disabled){transform:translateY(-1px)}
button.ghost{background:var(--field);color:var(--fg);border-color:var(--edge)}
button:disabled{opacity:.4;cursor:default}
input{text-align:center}
#code{width:6.5em;text-transform:uppercase;letter-spacing:.15em}
#name{width:14em}
svg{width:min(94vw,var(--bw,560px));height:auto;touch-action:manipulation;display:block}
.hit{stroke:transparent;cursor:pointer}
.line{stroke-linecap:round;stroke-width:var(--lw,7)}
.sweep{stroke-dasharray:var(--len,60);animation:sweep .5s cubic-bezier(.3,1.3,.5,1) both}
@keyframes sweep{from{stroke-dashoffset:var(--len,60);stroke-width:calc(var(--lw,7)*.55)}65%{stroke-dashoffset:0;stroke-width:calc(var(--lw,7)*1.7)}to{stroke-dashoffset:0;stroke-width:var(--lw,7)}}
#msg{min-height:1.5em;color:var(--mut);margin:8px 0;text-align:center;font-weight:500}
.code{font-family:ui-monospace,monospace;font-size:1.3rem;letter-spacing:.2em;font-weight:700}
.hide{display:none!important}
.pop{animation:pop .5s ease-out both}
@keyframes pop{0%{transform:scale(.3);opacity:0}55%{transform:scale(1.2);opacity:1}78%{transform:scale(.93)}100%{transform:scale(1)}}
</style></head><body>
<h1>Squared</h1>
<p class="sub">Time to take somebody to school</p>
<div id="lobby" class="card hide">
 <label for="name">Your name</label>
 <input id="name" maxlength="12" placeholder="Type your name" autocomplete="nickname">
 <div class="row"><label for="size">Grid</label><select id="size"><option value="5">5 × 5 dots</option><option value="10">10 × 10 dots</option><option value="15">15 × 15 dots</option><option value="20">20 × 20 dots</option><option value="25">25 × 25 dots</option></select><button id="create">Start a game</button></div>
 <div class="row">or join with a code <input id="code" maxlength="4" placeholder="ABCD" autocapitalize="characters"><button id="join">Join</button></div>
</div>
<div id="game" class="hide">
 <div class="row">Room <span class="code" id="rc"></span><span id="gs" style="color:var(--mut)"></span><button id="copy" class="ghost">Copy link</button></div>
 <div class="row"><span class="pill" id="s1"></span><span class="pill" id="s2"></span></div>
 <div class="card"><svg id="b" viewBox="0 0 300 300"></svg></div>
</div>
<div id="msg"></div>
<div class="row hide" id="ctl"><button id="again" disabled>Rematch</button><button id="leave" class="ghost">Leave</button></div>
<script>
const NS="http://www.w3.org/2000/svg",$=i=>document.getElementById(i);
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
let token=store.get("dab-token");
if(!token){const a=new Uint8Array(16);crypto.getRandomValues(a);token=[...a].map(x=>x.toString(16).padStart(2,"0")).join("");store.set("dab-token",token)}
let room=null,es=null,g=null,busy=false,seen=new Set(),primed=false;
const col=p=>`var(--p${p+1})`,say=t=>$("msg").textContent=t;
const myName=()=>$("name").value.trim();
const initial=i=>(Array.from(g.names[i])[0]||"?").toUpperCase();
function show(w){$("lobby").classList.toggle("hide",w!=="lobby");$("game").classList.toggle("hide",w!=="game");$("ctl").classList.toggle("hide",w!=="game");
 if(w==="lobby")say("Enter your name, then create a game or join with a code.")}
async function post(path,body){
 const r=await fetch("/api/"+path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,...body})});
 const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"request failed");return j}
function svgEl(n,a){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e}

async function create(){store.set("dab-name",myName());try{store.set("dab-size",$("size").value);const{code}=await post("create",{name:myName(),size:+$("size").value});enter(code)}catch(e){say("Couldn't create game: "+e.message)}}
function joinCode(){const c=$("code").value.trim().toUpperCase();if(c.length!==4)return say("Enter the 4-letter room code.");store.set("dab-name",myName());enter(c)}
async function enter(c){
 try{await post("join",{code:c,name:store.get("dab-name")||""})}catch(e){store.set("dab-room");history.replaceState(null,"","#");show("lobby");say(e.message==="no such room"?"No game with that code.":e.message);return}
 room=c;store.set("dab-room",c);history.replaceState(null,"","#"+c);$("rc").textContent=c;show("game");seen=new Set();primed=false;
 es&&es.close();es=new EventSource(`/api/events?code=${c}&token=${token}`);
 es.onmessage=m=>{const d=JSON.parse(m.data);if(g&&d.mv<g.mv&&d.round===g.round)return;if(g&&d.round!==g.round){seen=new Set();primed=false}g=d;draw()};
 es.onerror=()=>{say("Reconnecting…")};
}
function leave(){es&&es.close();es=null;g=null;room=null;store.set("dab-room");history.replaceState(null,"","#");show("lobby")}

function draw(){
 const N=g.n,S=260/N,M=20,svg=$("b"),ins=S*.07;svg.innerHTML="";
 svg.style.setProperty("--bw",Math.min(1000,560+(N-4)*22)+"px");
 svg.style.setProperty("--lw",Math.max(2,S*.11).toFixed(2));svg.style.setProperty("--len",S.toFixed(2));
 $("gs").textContent=" · "+(N+1)+"×"+(N+1)+" dots";
 for(let r=0;r<N;r++)for(let c=0;c<N;c++){const k=r+","+c,o=g.own[k],cx=M+c*S+S/2,cy=M+r*S+S/2;
  const rect=svgEl("rect",{x:M+c*S+ins,y:M+r*S+ins,width:S-2*ins,height:S-2*ins,rx:S*.16,fill:o==null?"transparent":col(o)});svg.appendChild(rect);
  if(o!=null){const t=svgEl("text",{x:cx,y:cy+S*.15,"text-anchor":"middle","font-size":S*.42,"font-weight":800,fill:"var(--on)"});t.textContent=initial(o);svg.appendChild(t);
   if(!seen.has("b"+k)){seen.add("b"+k);if(primed)for(const n of[rect,t]){n.classList.add("pop");n.style.transformOrigin=`${cx}px ${cy}px`}}}}
 const my=g.you===g.turn&&!g.over&&g.joined[1],hw=Math.min(28,S*.6);
 const list=[];for(let r=0;r<=N;r++)for(let c=0;c<N;c++)list.push(["h",r,c]);
 for(let r=0;r<N;r++)for(let c=0;c<=N;c++)list.push(["v",r,c]);
 for(const[t,r,c]of list){
  const x1=M+c*S,y1=M+r*S,x2=t==="h"?x1+S:x1,y2=t==="h"?y1:y1+S,k=t+r+","+c,o=g.e[k];
  if(o==null){if(my){const h=svgEl("line",{x1,y1,x2,y2,class:"hit"});h.style.strokeWidth=hw;h.onclick=()=>move(k);svg.appendChild(h)}continue}
  const fresh=!seen.has(k)&&primed;seen.add(k);
  const l=svgEl("line",{x1,y1,x2,y2,class:"line"+(fresh?" sweep":"")});l.style.stroke=col(o);svg.appendChild(l)}
 for(let r=0;r<=N;r++)for(let c=0;c<=N;c++)svg.appendChild(svgEl("circle",{cx:M+c*S,cy:M+r*S,r:Math.max(2.2,S*.1),fill:"var(--dot)"}));
 const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
 const tag=i=>`<span class="dot${g.online[i]?" on":""}"></span>${esc(g.names[i])}${g.you===i?" (you)":""}: ${g.sc[i]}`;
 $("s1").innerHTML=tag(0);$("s2").innerHTML=tag(1);
 $("s1").classList.toggle("on",!g.over&&g.turn===0);$("s2").classList.toggle("on",!g.over&&g.turn===1);
 primed=true;
 $("again").disabled=!g.over||g.you<0;
 const nm=i=>g.names[i];
 if(!g.joined[1])say(g.you===0?"Waiting for your opponent — share the link or code "+room+".":"Joining…");
 else if(g.over){const[a,b]=g.sc;say(a===b?"It's a draw!":g.you<0?`${nm(a>b?0:1)} wins!`:(a>b?0:1)===g.you?"You win! 🎉":`${nm(a>b?0:1)} wins — rematch?`)}
 else if(g.you<0)say(`Spectating — ${nm(g.turn)} to move.`);
 else say(my?"Your move":`Waiting for ${nm(g.turn)}…`);
}
async function move(k){
 if(busy)return;busy=true;
 try{await post("move",{code:room,edge:k})}catch(e){say(e.message)}busy=false}
$("create").onclick=create;$("join").onclick=joinCode;
$("code").onkeydown=e=>{if(e.key==="Enter")joinCode()};
$("again").onclick=()=>post("rematch",{code:room}).catch(e=>say(e.message));
$("leave").onclick=leave;
$("copy").onclick=async()=>{const u=location.origin+"/#"+room;try{await navigator.clipboard.writeText(u);$("copy").textContent="Copied!"}catch(e){$("copy").textContent=u}
 setTimeout(()=>$("copy").textContent="Copy link",1500)};
$("name").value=store.get("dab-name")||"";$("size").value=store.get("dab-size")||"5";
const h=(location.hash||"").replace("#","").toUpperCase()||store.get("dab-room");
if(h&&h.length===4&&store.get("dab-name"))enter(h);
else{show("lobby");if(h&&h.length===4){$("code").value=h;say("Enter your name, then press Join.")}}
</script></body></html>
